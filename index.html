<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SEMPDEC</title>
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
</head>
<body>
  <p id="status" style="font-family:sans-serif;text-align:center;margin-top:30vh;color:#555">Carregando...</p>

  <!-- Apenas decide o destino: logado -> cadastro.html, não logado -> login.html -->
  <script type="module">
    const status = document.getElementById("status");
    let redirecionado = false;

    function ir(destino) {
      if (redirecionado) return;
      redirecionado = true;
      window.location.replace(destino);
    }

    try {
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js");
      const { getAuth, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js");
      const auth = getAuth(initializeApp({
        apiKey: "AIzaSyBCcGYGrMU67_lMh3LHyGfcXGGNpJXPRdY",
        authDomain: "sisdec-970f4.firebaseapp.com",
        projectId: "sisdec-970f4",
        storageBucket: "sisdec-970f4.firebasestorage.app",
        messagingSenderId: "618228690979",
        appId: "1:618228690979:web:db91659f8211b022c24196"
      }));

      onAuthStateChanged(auth, (user) => ir(user ? "cadastro.html" : "login.html"));
    } catch (erro) {
      console.error("Erro ao verificar login:", erro);
      status.textContent = "Não foi possível verificar o login: " + erro.message;
      setTimeout(() => ir("login.html"), 3000);
    }
  </script>
</body>
</html>
