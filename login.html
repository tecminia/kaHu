<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mtag</title>    
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none; /* Impede seleção de texto */
    }

    body {
      background: #ff9340;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-container {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 360px;
      text-align: center;
    }

    .logo {
      max-width: 150px;
      height: auto;
      margin-bottom: 30px;
      animation: pulse 2s infinite ease-in-out;
      border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(0, 123, 255, 0.2);
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 2px #ff6a00);
      }
      50% {
        transform: scale(1.05);
        filter: drop-shadow(0 0 8px #007bff);
      }
    }

    h2 {
      color: #ff6a00;
      margin-bottom: 25px;
      font-weight: 600;
      font-size: 1.8rem;
    }

    label {
      display: block;
      text-align: left;
      margin-bottom: 8px;
      font-weight: 600;
      color: #007bff;
      font-size: 0.9rem;
    }

    .input-container {
      position: relative;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px 40px 12px 14px;
      border: 2px solid #007bff;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    input:focus {
      border-color: #ff6a00;
      box-shadow: 0 0 8px rgba(255, 106, 0, 0.3);
      outline: none;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #007bff;
      font-size: 1.2rem;
    }

    button {
      width: 100%;
      background: #ff6a00;
      color: #ffffff;
      padding: 14px 0;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      margin-bottom: 10px;
    }

    button:hover:not(:disabled) {
      background: #e05a00;
      transform: translateY(-2px);
    }

    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }

    .mensagem {
      margin-bottom: 20px;
      padding: 12px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
      background-color: #ffe0e0;
      color: #a00;
      border: 1px solid #e00;
      display: none;
      transition: opacity 0.3s ease;
    }

    .mensagem.show {
      display: block;
      opacity: 1;
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 3px solid #ffffff;
      border-top: 3px solid #888;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      vertical-align: middle;
      margin-left: 8px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .register-link {
      font-size: 0.9rem;
      color: #007bff;
      margin-top: 12px;
      display: block;
      cursor: pointer;
      text-decoration: underline;
    }

    @media (max-width: 400px) {
      .login-container {
        padding: 30px 20px;
        max-width: 90%;
      }

      .logo {
        max-width: 120px;
      }

      h2 {
        font-size: 1.5rem;
      }

      button {
        font-size: 1rem;
        padding: 12px 0;
      }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfigAuth = {
      apiKey: "AIzaSyBCcGYGrMU67_lMh3LHyGfcXGGNpJXPRdY",
      authDomain: "sisdec-970f4.firebaseapp.com",
      projectId: "sisdec-970f4",
      storageBucket: "sisdec-970f4.firebasestorage.app",
      messagingSenderId: "618228690979",
      appId: "1:618228690979:web:db91659f8211b022c24196"
    };
    const auth = getAuth(initializeApp(firebaseConfigAuth));
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    function mostrarMensagem(texto) {
      const msg = document.getElementById("mensagem");
      msg.innerText = texto;
      msg.classList.add("show");
    }

    // Retorno do login por redirecionamento (usado quando o popup é bloqueado)
    getRedirectResult(auth)
      .then((resultado) => {
        if (resultado && resultado.user) window.location.href = "cadastro.html";
      })
      .catch((error) => {
        console.error("Erro no retorno do login:", error);
        mostrarMensagem("Erro ao entrar com o Google. Tente novamente.");
      });

    window.loginGoogle = async function () {
      const botao = document.getElementById("btnGoogle");
      const textoOriginal = botao.innerHTML;
      document.getElementById("mensagem").classList.remove("show");

      botao.disabled = true;
      botao.innerHTML = `Entrando <span class="spinner"></span>`;

      try {
        await signInWithPopup(auth, provider);
        window.location.href = "cadastro.html";
      } catch (error) {
        console.error("Erro ao logar:", error);
        switch (error.code) {
          case "auth/popup-blocked":
            await signInWithRedirect(auth, provider);
            return;
          case "auth/popup-closed-by-user":
          case "auth/cancelled-popup-request":
            break;
          case "auth/unauthorized-domain":
            mostrarMensagem("Domínio não autorizado no Firebase (Authentication > Configurações > Domínios autorizados).");
            break;
          case "auth/operation-not-allowed":
            mostrarMensagem("Login com Google não está ativado no Firebase.");
            break;
          case "auth/network-request-failed":
            mostrarMensagem("Sem conexão. Verifique a internet.");
            break;
          default:
            mostrarMensagem("Erro ao entrar com o Google. Tente novamente.");
        }
        botao.disabled = false;
        botao.innerHTML = textoOriginal;
      }
    };
  </script>
</head>
<body>
  <div class="login-container">
    <img src="assets/favicon.ico" alt="Logo Mtag" class="logo" width="150" />
    <h2>Login</h2>
    <div id="mensagem" class="mensagem"></div>
    <button type="button" id="btnGoogle" onclick="loginGoogle()"><svg width="20" height="20" viewBox="0 0 48 48" style="vertical-align:middle;margin-right:10px" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.100 0 24s.9 7.600 2.600 10.800l7.900-6.100z"/><path fill="#34A853" d="M24 48c6.300 0 11.600-2.100 15.400-5.700l-7.500-5.800c-2.100 1.400-4.800 2.300-7.900 2.300-6.300 0-11.600-4.100-13.500-9.800l-7.900 6.100C6.500 42.600 14.600 48 24 48z"/></svg>Entrar com Google</button>
  </div>
</body>
</html>
